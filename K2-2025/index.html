<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢源閱寫音頻 - 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #FF4D4D 0%, #FFBE63 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 15px;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            opacity: 0.9;
            font-size: 1rem;
        }

        .audio-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .audio-card h3 {
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 6px;
        }

        .audio-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        audio {
            width: 100%;
            height: 50px;
            border-radius: 8px;
        }

        audio::-webkit-media-controls-panel {
            background: #f0f0f0;
        }

        .passage-number {
            display: inline-block;
            background: linear-gradient(135deg, #FF4D4D 0%, #FFBE63 100%);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-weight: bold;
            font-size: 0.9rem;
            margin-right: 10px;
        }

        .title-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 30px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <!-- REPLACE THE URL BELOW WITH YOUR LOGO URL FROM CLOUDINARY -->
            <img src="https://res.cloudinary.com/dqydozdk8/image/upload/v1766923440/wechat_logo_final_foqzoy.jpg" alt="Logo" class="logo">
            
            <h1>📚 漢源K2閱寫音頻</h1>
            <p>2025-2026</p>
        </header>

        <!-- PASSAGE 1 - Change the title, description, and audio URL -->

            </div>
            <p>彩虹橋</p>
            <audio controls preload="metadata">
                <!-- REPLACE THE URL BELOW WITH YOUR AUDIO URL FROM CLOUDINARY -->

                Your browser does not support audio.
            </audio>
        </div>
        <div class="audio-card">

            </div>
