        .audio-card {

            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        audio {
            width: 100%;
            height: 50px;
            border-radius: 8px;
        }

        audio::-webkit-media-controls-panel {
            background: #f0f0f0;
        }

        .passage-number {
            display: inline-block;
            background: linear-gradient(135deg, #FF4D4D 0%, #FFBE63 100%);

        .title-row {

            margin-bottom: 8px;
        }

        footer {
            text-align: center;
            color: white;
            opacity: 0.8;
            margin-top: 30px;
            font-size: 0.85rem;
        }
    </style>
